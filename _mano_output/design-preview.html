<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anima — Composition Example</title>
  <style>
    :root { --bg:#060a16; --surface:#11182a; --stage:#0a1224; --text:#f8fafc; --muted:#a8b4cc; --accent:#7c3aed; --accent-soft:#a78bfa; --positive:#2dd4bf; --border:#26324b; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 50% -10%,#192d5b 0,transparent 35%),var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; }
    .app { width:min(100%,1200px); overflow:hidden; border:1px solid #1b2942; border-radius:20px; background:#080f20; box-shadow:0 24px 70px #0009; }
    header { display:flex; align-items:center; gap:16px; padding:22px 30px; border-bottom:1px solid var(--border); background:linear-gradient(90deg,#0b1222,#0d1325); }
    .mark { width:40px; height:40px; border:2px solid var(--accent-soft); border-radius:50%; display:grid; place-items:center; color:var(--accent-soft); box-shadow:0 0 20px #7c3aed66; font-size:20px; }
    h1 { margin:0; font-size:28px; line-height:1.05; } header p { margin:4px 0 0; color:var(--muted); font-size:14px; }
    main { margin:24px; padding:28px 32px 24px; border:1px solid #2b3a57; border-radius:24px; background:radial-gradient(ellipse at 50% 46%,#5423a92e 0,transparent 48%),var(--stage); }
    .title-row { display:flex; justify-content:space-between; gap:16px; align-items:start; } h2 { margin:0; font-size:20px; } .title-row p { margin:6px 0 0; color:var(--muted); } .counter { color:var(--muted); font-size:12px; letter-spacing:.08em; }
    .cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin:40px auto 32px; max-width:680px; }
    .card { position:relative; min-height:160px; overflow:hidden; border:1px solid var(--border); border-radius:12px; background:#10182b; box-shadow:0 10px 24px #0005; }
    .card::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,#060a1626,#060a1666); pointer-events:none; }
    .card svg { display:block; width:100%; height:100%; min-height:160px; }
    .card.active { border-color:var(--accent-soft); box-shadow:0 0 0 1px #b79cff55,0 0 28px #7c3aed77; transform:translateY(-5px) scale(1.03); }
    .card.complete { border-color:#2dd4bfaa; }
    .dock { display:flex; width:max-content; max-width:100%; margin:auto; overflow:auto; padding:5px; border:1px solid var(--border); border-radius:16px; background:#11182ad9; box-shadow:0 12px 30px #0008; }
    .choice { position:relative; z-index:1; padding:11px 16px; border:0; border-radius:11px; background:transparent; color:var(--muted); font:600 14px/1 Inter,system-ui,sans-serif; white-space:nowrap; }
    .choice.selected { color:#fff; background:linear-gradient(135deg,#8b5cf6,#6330d6); box-shadow:0 0 18px #7c3aed77; }
    .swatches { display:flex; gap:10px; padding:0 24px 24px; } .swatch { width:24px; height:24px; border:1px solid #ffffff33; border-radius:50%; }
    @media (max-width:650px) { header { padding:18px; } h1 { font-size:23px; } main { margin:14px; padding:22px 16px; } .cards { gap:10px; margin:32px 0 24px; } .card { min-height:110px; font-size:34px; } .choice { padding:10px 12px; } }
  </style>
</head>
<body>
  <section class="app" aria-label="Composition example scene preview">
    <header><div class="mark">◉</div><div><h1>Composition</h1><p>Combine simple animations into expressive flows.</p></div></header>
    <main>
      <div class="title-row"><div><h2>Stagger</h2><p>Each card begins after the one before it.</p></div><span class="counter">03 / 06</span></div>
      <div class="cards" aria-label="Animated artwork cards">
        <div class="card" aria-label="Moonlit mountain artwork"><svg viewBox="0 0 240 160" role="img" aria-hidden="true"><defs><linearGradient id="sky-a" x2="0" y2="1"><stop stop-color="#442879"/><stop offset="1" stop-color="#10244b"/></linearGradient></defs><rect width="240" height="160" fill="url(#sky-a)"/><circle cx="175" cy="42" r="22" fill="#ffbf79" opacity=".9"/><path d="M0 128 55 72l32 37 38-55 80 74v32H0Z" fill="#1b2148"/><path d="m65 118 30-34 24 28 29-37 48 53v32H0Z" fill="#2d3568"/></svg></div>
        <div class="card active" aria-label="Sunset mountain artwork"><svg viewBox="0 0 240 160" role="img" aria-hidden="true"><defs><linearGradient id="sky-b" x2="0" y2="1"><stop stop-color="#f378a0"/><stop offset="1" stop-color="#6f3fab"/></linearGradient></defs><rect width="240" height="160" fill="url(#sky-b)"/><circle cx="120" cy="66" r="27" fill="#ffd487"/><path d="M0 133 60 83l37 38 37-61 106 73v27H0Z" fill="#3d286b"/><path d="M0 141 68 104l36 23 43-38 93 52v19H0Z" fill="#251a50"/></svg></div>
        <div class="card complete" aria-label="Ocean wave artwork"><svg viewBox="0 0 240 160" role="img" aria-hidden="true"><defs><linearGradient id="sky-c" x2="0" y2="1"><stop stop-color="#6bd3db"/><stop offset="1" stop-color="#1c567f"/></linearGradient></defs><rect width="240" height="160" fill="url(#sky-c)"/><circle cx="66" cy="43" r="22" fill="#e1ffdc" opacity=".8"/><path d="M0 126c27-37 54-40 82-4 26 33 51 28 78-6 22-29 49-25 80 10v34H0Z" fill="#146d8a"/><path d="M0 144c35-29 71-20 108-3 37 17 83 12 132-9v28H0Z" fill="#0c385f"/></svg></div>
      </div>
      <nav class="dock" aria-label="Composition type"><button class="choice">Sequence</button><button class="choice">Parallel</button><button class="choice selected" aria-current="true">Stagger</button><button class="choice">Repeat</button><button class="choice">Race</button><button class="choice">Conditional</button></nav>
    </main>
    <div class="swatches" aria-label="Palette"><span class="swatch" style="background:#060a16"></span><span class="swatch" style="background:#11182a"></span><span class="swatch" style="background:#7c3aed"></span><span class="swatch" style="background:#2dd4bf"></span></div>
  </section>
</body>
</html>
