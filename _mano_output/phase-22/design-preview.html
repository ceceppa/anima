*{box-sizing:border-box}body{margin:0;background:#060A16;color:#F8FAFC;font:14px Inter,system-ui,sans-serif;padding:32px}main{max-width:960px;margin:auto}.head,.stage,.dock,.state{background:#11182A;border:1px solid #26324B;border-radius:16px}.head{padding:20px 24px;margin-bottom:24px}h1{margin:0;font-size:28px}.sub{color:#A8B4CC;margin:6px 0 0}.stage{background:#0A1224;border-radius:24px;padding:28px;min-height:280px;display:grid;place-items:center;position:relative;overflow:hidden}.grid{display:grid;grid-template-columns:repeat(3,92px);gap:14px}.card{height:92px;border:1px solid #A78BFA;border-radius:12px;background:linear-gradient(135deg,#1c2440,#11182A);box-shadow:0 0 26px #7C3AED55}.motion{width:110px;height:110px;border-radius:50%;background:#7C3AED;border:2px solid #A78BFA;box-shadow:0 0 32px #7C3AED;transition:.5s}.dock{display:flex;gap:8px;padding:8px;margin-top:16px}.choice{padding:10px 14px;border-radius:10px;color:#A8B4CC}.choice.active{background:#7C3AED;color:#F8FAFC;font-weight:700}.state{margin-top:16px;padding:12px 16px;color:#F8FAFC}.label{color:#A8B4CC;text-transform:uppercase;font-size:12px;letter-spacing:.08em;margin-bottom:8px}</style><main><section class="head"><h1>Motion Interruption</h1><p class="sub">Choose an outcome while the target is moving. Restart returns it to the defined start.</p></section><div class="label">Layout transition preview</div><section class="stage"><div class="grid"><i class="card"></i><i class="card"></i><i class="card"></i><i class="card"></i><i class="card"></i><i class="card"></i></div></section><div class="dock"><span class="choice active">Trigger layout change</span><span class="choice">Restart</span></div><div class="label" style="margin-top:28px">Interruption preview</div><section class="stage"><div class="motion"></div></section><div class="dock"><span class="choice active">Replace</span><span class="choice">Retarget</span><span class="choice">Queue</span><span class="choice">Reverse</span></div><div class="st
